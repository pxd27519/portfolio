name: Java CI — Portfolio Build and Test

'on':
  push:
    branches:
      - main
      - Feature-MyPortfolio
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean install
        working-directory: src

      - name: Run Tests
        run: mvn test
        working-directory: src